name: Publish JinPDF v1.2.0
on:
  push:
    branches: ['codex/release-v1.2.0']
permissions:
  contents: write
jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: '673d874766a4ff4ce350f5c4c8a357a72c9c8b51'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - run: python -m pip install -r requirements.txt
      - shell: pwsh
        run: |
          $env:PYTHONPATH = (Resolve-Path src).Path
          python -m unittest discover -s tests -v
      - shell: pwsh
        run: ./build.ps1
      - name: Publish v1.2.0
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: '673d874766a4ff4ce350f5c4c8a357a72c9c8b51'
        run: |
          $assets = @(Get-ChildItem dist -Filter 'JinPDF-v1.2.0-*.zip' | ForEach-Object FullName)
          if ($assets.Count -ne 2) { throw 'Expected the Windows ZIP and samples ZIP.' }
          $notes = Join-Path $env:RUNNER_TEMP 'jinpdf-v1.2.0.md'
          @'
          병합 탭 하단에서 마지막으로 성공한 병합의 파일명, 파일 수, 총 쪽수를 확인할 수 있습니다.
          `파일별 쪽수 보기`를 펼치면 각 파일이 PDF에 들어간 순서대로 쪽수를 확인할 수 있습니다.

          Windows 실행 ZIP 전체를 압축 해제한 뒤 `JinPDF.exe`를 실행하세요.
          '@ | Set-Content -LiteralPath $notes -Encoding utf8
          gh release create v1.2.0 @assets --target $env:RELEASE_COMMIT --title 'JinPDF v1.2.0' --notes-file $notes --latest --repo $env:GITHUB_REPOSITORY
          exit $LASTEXITCODE
