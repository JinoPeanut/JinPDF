name: Publish JinPDF v1.2.1
on:
  push:
    branches: ['codex/release-v1.2.1']
permissions:
  contents: write
jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: '7b59488d27f45aad5dbe45cc637286f2fbbe984a'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - run: python -m pip install -r requirements.txt
      - shell: pwsh
        run: |
          $env:PYTHONPATH = (Resolve-Path src).Path
          python -m unittest discover -s tests -v
      - shell: pwsh
        run: ./build.ps1
      - name: Publish v1.2.1
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: '7b59488d27f45aad5dbe45cc637286f2fbbe984a'
        run: |
          $assets = @(Get-ChildItem dist -Filter 'JinPDF-v1.2.1-*.zip' | ForEach-Object FullName)
          if ($assets.Count -ne 2) { throw 'Expected the Windows ZIP and samples ZIP.' }
          $notes = Join-Path $env:RUNNER_TEMP 'jinpdf-v1.2.1.md'
          @'
          병합 탭에 파일을 하나만 추가해도 `병합하기`를 누를 수 있습니다. 결과를 `_병합.pdf`로 저장하고 새 탭에서 엽니다.
          README 하단에서 버전별 변경 내역을 확인할 수 있습니다.

          Windows 실행 ZIP 전체를 압축 해제한 뒤 `JinPDF.exe`를 실행하세요.
          '@ | Set-Content -LiteralPath $notes -Encoding utf8
          gh release create v1.2.1 @assets --target $env:RELEASE_COMMIT --title 'JinPDF v1.2.1' --notes-file $notes --latest --repo $env:GITHUB_REPOSITORY
          exit $LASTEXITCODE
